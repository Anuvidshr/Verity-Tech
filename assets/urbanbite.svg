<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="ubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A0D"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>
    <linearGradient id="ubAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#ubBg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="#0C1422" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Mini Header -->
  <rect x="40" y="45" width="120" height="14" rx="4" fill="#F8FAFC" opacity="0.9"/>
  <rect x="360" y="48" width="50" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
  <rect x="425" y="48" width="50" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
  <rect x="490" y="42" width="70" height="20" rx="10" fill="url(#ubAccent)"/>
  <text x="502" y="56" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">ORDER</text>

  <!-- Hero Banner -->
  <rect x="40" y="85" width="520" height="150" rx="12" fill="#18131E" stroke="rgba(255,107,107,0.25)" stroke-width="1"/>
  
  <!-- Food / Grill Icon Motif -->
  <circle cx="480" cy="160" r="50" fill="rgba(255,107,107,0.1)"/>
  <circle cx="480" cy="160" r="35" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M465 160 L495 160" stroke="#FFA07A" stroke-width="4" stroke-linecap="round"/>
  <path d="M472 150 L488 170" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>

  <!-- Content typography -->
  <rect x="65" y="110" width="90" height="12" rx="6" fill="#FF6B6B" opacity="0.9"/>
  <text x="73" y="119" font-family="sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">GOURMET BISTRO</text>
  <text x="65" y="152" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">UrbanBite Smoke &amp; Grill</text>
  <text x="65" y="174" font-family="sans-serif" font-size="11" fill="#94A3B8">Artisanal burgers, woodfired pizzas &amp; curated craft beverages.</text>
  
  <rect x="65" y="195" width="115" height="26" rx="13" fill="#FF6B6B"/>
  <text x="78" y="212" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Reserve Table (0 Comm)</text>
  <rect x="190" y="195" width="85" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="202" y="212" font-family="sans-serif" font-size="10" fill="#F8FAFC">Chef Specials</text>

  <!-- Feature Cards Row -->
  <rect x="40" y="255" width="160" height="100" rx="8" fill="#0C1B30" stroke="rgba(255,255,255,0.06)"/>
  <text x="55" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Direct Bookings</text>
  <text x="55" y="298" font-family="sans-serif" font-size="9" fill="#94A3B8">Capture table seats directly without 25% aggregator cuts.</text>
  <rect x="55" y="322" width="80" height="16" rx="4" fill="rgba(255,107,107,0.15)"/>
  <text x="63" y="333" font-family="sans-serif" font-size="8" font-weight="700" fill="#FF6B6B">0% Commission</text>

  <rect x="220" y="255" width="160" height="100" rx="8" fill="#0C1B30" stroke="rgba(255,255,255,0.06)"/>
  <text x="235" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Interactive Menu</text>
  <text x="235" y="298" font-family="sans-serif" font-size="9" fill="#94A3B8">High-res food photography with dietary indicators.</text>
  <rect x="235" y="322" width="70" height="16" rx="4" fill="rgba(99,230,190,0.15)"/>
  <text x="243" y="333" font-family="sans-serif" font-size="8" font-weight="700" fill="#63E6BE">Veg / Non-Veg</text>

  <rect x="400" y="255" width="160" height="100" rx="8" fill="#0C1B30" stroke="rgba(255,255,255,0.06)"/>
  <text x="415" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Weekend Offers</text>
  <text x="415" y="298" font-family="sans-serif" font-size="9" fill="#94A3B8">Dynamic announcement strip for seasonal happy hours.</text>
  <rect x="415" y="322" width="70" height="16" rx="4" fill="rgba(117,167,255,0.15)"/>
  <text x="423" y="333" font-family="sans-serif" font-size="8" font-weight="700" fill="#75A7FF">Lead Booster</text>
</svg>
