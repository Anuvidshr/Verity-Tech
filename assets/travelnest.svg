<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="tnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08181E"/>
      <stop offset="100%" stop-color="#040C14"/>
    </linearGradient>
    <linearGradient id="tnAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#tnBg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="#0A1A24" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Mini Header -->
  <rect x="40" y="45" width="125" height="14" rx="4" fill="#F8FAFC" opacity="0.9"/>
  <rect x="360" y="48" width="50" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
  <rect x="425" y="48" width="50" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>
  <rect x="490" y="42" width="70" height="20" rx="10" fill="url(#tnAccent)"/>
  <text x="502" y="56" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#040C14">PACKAGES</text>

  <!-- Hero Banner -->
  <rect x="40" y="85" width="520" height="150" rx="12" fill="#0D2330" stroke="rgba(45,212,191,0.25)" stroke-width="1"/>
  
  <!-- Mountain & Compass Graphic -->
  <path d="M440 190 L475 140 L495 165 L525 125 L545 190 Z" fill="rgba(45,212,191,0.18)" stroke="#2DD4BF" stroke-width="1.5"/>
  <circle cx="530" cy="115" r="10" fill="#38BDF8" opacity="0.7"/>

  <!-- Content typography -->
  <rect x="65" y="110" width="130" height="12" rx="6" fill="#2DD4BF" opacity="0.9"/>
  <text x="73" y="119" font-family="sans-serif" font-size="8" font-weight="700" fill="#040C14">TRAVEL &amp; ADVENTURE</text>
  <text x="65" y="152" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">TravelNest Holidays</text>
  <text x="65" y="174" font-family="sans-serif" font-size="11" fill="#94A3B8">Curated Himalayan trails, Kerala backwaters &amp; custom bespoke getaways.</text>
  
  <rect x="65" y="195" width="130" height="26" rx="13" fill="#2DD4BF"/>
  <text x="78" y="212" font-family="sans-serif" font-size="10" font-weight="700" fill="#040C14">Explore Itineraries</text>
  <rect x="205" y="195" width="105" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
  <text x="217" y="212" font-family="sans-serif" font-size="10" fill="#F8FAFC">WhatsApp Concierge</text>

  <!-- Feature Cards Row -->
  <rect x="40" y="255" width="160" height="100" rx="8" fill="#081822" stroke="rgba(255,255,255,0.06)"/>
  <text x="55" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Day-Wise Itinerary</text>
  <text x="55" y="298" font-family="sans-serif" font-size="9" fill="#94A3B8">Crystal clear schedules with meal and hotel details.</text>
  <rect x="55" y="322" width="75" height="16" rx="4" fill="rgba(45,212,191,0.15)"/>
  <text x="63" y="333" font-family="sans-serif" font-size="8" font-weight="700" fill="#2DD4BF">Clear Specs</text>

  <rect x="220" y="255" width="160" height="100" rx="8" fill="#081822" stroke="rgba(255,255,255,0.06)"/>
  <text x="235" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Quick WhatsApp</text>
  <text x="235" y="298" font-family="sans-serif" font-size="9" fill="#94A3B8">Connect straight with travel planner for custom dates.</text>
  <rect x="235" y="322" width="75" height="16" rx="4" fill="rgba(37,211,102,0.15)"/>
  <text x="243" y="333" font-family="sans-serif" font-size="8" font-weight="700" fill="#25D366">Fast Response</text>

  <rect x="400" y="255" width="160" height="100" rx="8" fill="#081822" stroke="rgba(255,255,255,0.06)"/>
  <text x="415" y="280" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Package Compare</text>
  <text x="415" y="298" font-family="sans-serif" font-size="9" fill="#94A3B8">Budget, Deluxe and Luxury tier breakdowns.</text>
  <rect x="415" y="322" width="70" height="16" rx="4" fill="rgba(56,189,248,0.15)"/>
  <text x="423" y="333" font-family="sans-serif" font-size="8" font-weight="700" fill="#38BDF8">50% Faster</text>
